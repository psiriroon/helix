# Psiriroon Dark Theme

# SYNTAX

# Color mappings:
# background -> white
# foreground -> black
#
# normal     -> foreground
# comment    -> cyan
# constant   -> lime
# variable   -> blue
# function   -> yellow
# type       -> purple

"attribute" = "lime"
"type" = "purple"
"constructor" = "purple"
"constant" = "lime"
"string" = "lime"
"comment" = { fg = "cyan", bg = "t_cyan", modifiers = ["italic"] }
"variable" = "blue"
"label" = "white"
"punctuation" = "gray"
"keyword" = "white"
"operator" = "white"
"function" = "yellow"
"tag" = "gray"
"namespace" = "black"
"special" = "black"
# TODO: add markup section

"diff.plus" = { fg = "green", bg = "t_green" }
"diff.minus" = { fg = "red", bg = "t_red" }
"diff.delta" = { fg = "blue", bg = "t_blue" }



# USER INTERFACE
"ui.background" = { bg = "black" }
"ui.background.separator" = "gray"
"ui.cursor" = { fg = "black", bg = "blue" }
"ui.cursor.normal" = { fg = "black", bg = "blue" }
"ui.cursor.insert" = { fg = "black", bg = "green" }
"ui.cursor.select" = { fg = "black", bg = "yellow" }
"ui.cursor.match" = { fg = "black", bg = "ash" }
"ui.statusline" = { fg = "black", bg = "white" }
"ui.statusline.inactive" = { fg = "ash", bg = "gray"}
"ui.statusline.normal" = { fg = "black", bg = "blue" }
"ui.statusline.insert" = { fg = "black", bg = "green" }
"ui.statusline.select" = { fg = "black", bg = "yellow" }
"ui.statusline.separator" = "gray"
"ui.text" = "normal"
"ui.selection" = { fg = "black", bg = "gray" }
"warning" = "yellow"
"warning.diagnostic.inline" = "yellow"
"error" = "red"
"error.diagnostic.inline" = "red"

[palette]
"black" = "#0E1019"
"ash" = "#232323"
"gray" = "#5A5A5A"
"silver" = "#9C9C9C"
"white" = "#FFFAF4"

"red" = "#FF000F"
"magenta" = "#E67BF7"
"purple" = "#9A5FEB"
"blue" = "#0092FF"
"sky" = "#4DBCFF"
"cyan" = "#00D8EB"
"green" = "#0EB75B"
"lime" = "#8CE10B"
"yellow" = "#FFB900"
"orange" = "#F87810"

# Translucent (25% opacity over background) colors
"t_red" = "#870814"
"t_blue" = "#07518C"
"t_cyan" = "#0B424E"
"t_green" = "#0E643A"

